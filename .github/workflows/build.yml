name: Build

# Every push builds and tests. To publish a release, change the number in VERSION and push to main:
# if there's no release for that version yet, this creates tag vX.Y.Z and a GitHub Release with the
# installer and a portable .exe zip attached for download. (Pushing a vX.Y.Z tag works too.)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $release = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1); $release = 'true' }
          else {
            $base = (Get-Content VERSION -Raw).Trim()
            $exists = git tag --list "v$base"
            if ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push' -and -not $exists) { $v = $base; $release = 'true' }
            else { $v = "$base-dev.$env:GITHUB_RUN_NUMBER" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "number=$(($v -split '-')[0])" >> $env:GITHUB_OUTPUT

      - name: Test the 5250 engine
        run: dotnet run --project tests/Hamricks5250.Tests -c Release

      - name: Build Ham5250.exe (single file, no .NET install needed)
        run: >
          dotnet publish src/Hamricks5250.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.number }}
          -o publish

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\Ham5250.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\Ham5250.exe -DestinationPath "dist\Ham5250-Portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ham5250-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish the release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ham 5250 ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
